# Restores x86_64 macOS coverage that was dropped when rebasing onto upstream.
# GitHub no longer offers free Intel macOS runners, so this cross-compiles
# for x64-osx on an arm64 host. The x86_64 binary is built but not executed
# here (arm64 cannot run x64 binaries without Rosetta, which we don't rely on
# in CI). The build itself validates that the x86_64 macOS toolchain works.

name: emf2svg - MacOS-x86_64

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/cache

jobs:
  cross-compile-x64-osx:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-26
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - run: brew install bash argp-standalone coreutils

    - run: mkdir -p ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}

    - uses: actions/cache@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: ${{ github.workflow }}-${{ matrix.runner }}-vcpkg-${{ hashFiles('sm.txt') }}

    - run: git submodule status > sm.txt

    - run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DVCPKG_TARGET_TRIPLET=x64-osx \
          -DCMAKE_OSX_ARCHITECTURES=x86_64 \
          -DLONLY=ON \
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

    - run: cmake --build build --config ${{ env.BUILD_TYPE }}

    - name: Verify x86_64 architecture of the library
      run: |
        lipo -info ./build/libemf2svg.*.dylib 2>/dev/null || \
        file ./build/libemf2svg.* 2>/dev/null || true
        file ./build/libemf2svg.* | grep -q x86_64 || \
          (echo "::error::Built library is not x86_64" && exit 1)
