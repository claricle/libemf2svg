name: emf2svg - Windows-x86_64

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
          - runner: windows-2025
          - runner: windows-2025-vs2026
    runs-on: ${{ matrix.runner }}
    env:
      VCPKG_REF: 4f95fba7a7d1101bb8acdeb51e4609686449701e
    steps:
    - uses: actions/checkout@v4
    - run: mkdir cache
    - uses: actions/cache@v4
      with:
        path: |
          cache
          vcpkg\.git
          vcpkg\buildtrees
          vcpkg\downloads
          vcpkg\packages
        key: ${{ github.workflow }}-${{ matrix.runner }}-vcpkg-${{ env.VCPKG_REF }}
    - name: Bootstrap vcpkg
      shell: pwsh
      run: |
        # Cache restores vcpkg/.git but not the working tree or vcpkg.exe.
        # If we have a partial dir without vcpkg.exe, nuke and re-clone to
        # get a clean working tree (the cached .git alone isn't enough for
        # bootstrap-vcpkg.bat to find its own files).
        if ((Test-Path vcpkg) -and -not (Test-Path vcpkg/vcpkg.exe)) {
          Remove-Item -Recurse -Force vcpkg
        }
        if (-not (Test-Path vcpkg)) {
          git clone https://github.com/microsoft/vcpkg.git vcpkg
        }
        if (-not (Test-Path vcpkg/vcpkg.exe)) {
          Push-Location vcpkg
          git checkout $env:VCPKG_REF --force
          .\bootstrap-vcpkg.bat -disableMetrics
          Pop-Location
        }
    - run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake
    - run: cmake --build build --config ${{ env.BUILD_TYPE }}
    - run: |
        build\${{ env.BUILD_TYPE }}\emf2svg-conv.exe --version
        build\${{ env.BUILD_TYPE }}\emf2svg-conv.exe -i tests\resources\emf\test-000.emf -o test-000.svg
        dir . | findstr test-000.svg
