name: emf2svg - MacOS-arm64

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-14      # deprecated but still available; remove when decommissioned
          - macos-15
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.runner == 'macos-14' }}
    steps:
    - uses: actions/checkout@v4
    - run: brew install argp-standalone coreutils libpng freetype fontconfig
    - run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
    - run: cmake --build build --config ${{ env.BUILD_TYPE }}
    # Skip valgrind (-n): valgrind on macOS is flaky (LouisBrunner/valgrind-macos#56).
    # xmllint checks still run, so SVG correctness still gates CI.
    - run: ./tests/resources/check_correctness.sh -n -r -s
    - run: ./tests/resources/check_correctness.sh -n -r -s -e tests/resources/emf-corrupted/ -xN
    - run: ./tests/resources/check_correctness.sh -n -r -s -e tests/resources/emf-ea/
