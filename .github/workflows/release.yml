# Builds a source-only libemf2svg.tar.gz (no vcpkg submodule contents,
# no prebuilt binaries) and attaches it to the GitHub Release for the
# pushed tag.
#
# Per-platform compilation happens in downstream consumers (e.g.
# emf2svg-ruby), which bootstrap vcpkg themselves using the vcpkg.json
# manifest shipped in this tarball.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or ref to release'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || github.ref }}
        fetch-depth: 0
        # No submodules: we ship source only. vcpkg is bootstrapped by
        # the consumer, not bundled here.

    - name: Build source tarball
      run: ./scripts/build-release-tarball.sh "$RUNNER_TEMP"

    - name: Resolve tag name
      id: tag
      run: |
        if [ -n "${{ inputs.ref }}" ]; then
          ref="${{ inputs.ref }}"
        else
          ref="${GITHUB_REF#refs/tags/}"
        fi
        ref="${ref#refs/tags/}"
        echo "tag=$ref" >> "$GITHUB_OUTPUT"

    - name: Upload to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: ${{ steps.tag.outputs.tag }}
        generate_release_notes: true
        files: |
          ${{ runner.temp }}/libemf2svg.tar.gz
          ${{ runner.temp }}/libemf2svg.tar.gz.sha256
