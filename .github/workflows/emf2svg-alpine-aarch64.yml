name: emf2svg - Alpine-aarch64

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04-arm
    env:
      BUILD_TYPE: Release
    steps:
    - uses: actions/checkout@v4
    - run: git config --global --add safe.directory $(pwd)

    # GitHub Actions does not allow JS-based actions inside an Alpine
    # container on ARM64 runners (actions/runner#2006). Run the entire
    # build inside an Alpine container via `docker run`, with the
    # workspace mounted at /work.
    #
    # vcpkg has no public binary cache for arm64-linux, so we skip it
    # entirely and link against Alpine's -dev packages via pkg-config
    # (same approach the emf2svg-ruby gem's recipe takes for musl).
    - name: Build and test in Alpine container
      run: |
        docker run --rm \
          -v "$PWD:/work" \
          -w /work \
          -e BUILD_TYPE="${BUILD_TYPE}" \
          alpine:3.21 sh -c '
            set -eux
            apk --no-cache add \
              build-base cmake git valgrind argp-standalone clang \
              gperf flex bison python3 ninja pkgconfig \
              libxml2-utils font-noto-hebrew font-noto-arabic \
              libpng-dev freetype-dev fontconfig-dev libxml2-dev \
              gettext-dev zlib-dev libuuid linux-headers \
              autoconf autoconf-archive automake libtool file

            cmake -B build -G Ninja \
              -DCMAKE_MAKE_PROGRAM=ninja \
              -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++
            ninja -C build

            ./tests/resources/check_correctness.sh -r -s
            ./tests/resources/check_correctness.sh -r -s -e tests/resources/emf-corrupted/ -xN
            ./tests/resources/check_correctness.sh -r -s -e tests/resources/emf-ea/
          '
